name: model eval

on:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated provider:model entries
        required: true
        default: gemini:gemini-3.5-flash-lite,open:google/gemma-4-26b-a4b-it-maas,open:openai/gpt-oss-120b-maas,open:deepseek-ai/deepseek-v4.1-flash-maas,open:meta/llama-4-scout-17b-16e-instruct-maas,mistral:mistral-small-2503@us-central1,open:xai/grok-4.7
      repeats:
        description: Repetitions per case
        required: true
        default: '3'
      min_pass_rate:
        description: Minimum pass rate for every model
        required: true
        default: '0.70'
      min_critical_pass_rate:
        description: Minimum critical-case pass rate for every model
        required: true
        default: '0.70'

permissions:
  contents: read
  id-token: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/agent/requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_MODEL_EVAL_SERVICE_ACCOUNT }}

      - name: Install evaluator dependencies
        run: pip install -r services/agent/requirements.txt

      - name: Run model comparison
        env:
          EVAL_MODELS: ${{ inputs.models }}
          EVAL_REPEATS: ${{ inputs.repeats }}
          EVAL_MIN_PASS_RATE: ${{ inputs.min_pass_rate }}
          EVAL_MIN_CRITICAL_PASS_RATE: ${{ inputs.min_critical_pass_rate }}
        run: >-
          python services/agent/evals/run_model_comparison.py
          --project transit-203605
          --models "$EVAL_MODELS"
          --repeats "$EVAL_REPEATS"
          --request-timeout 90
          --min-pass-rate "$EVAL_MIN_PASS_RATE"
          --min-critical-pass-rate "$EVAL_MIN_CRITICAL_PASS_RATE"
          --output-dir model-eval-results

      - name: Upload detailed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-eval-${{ github.run_id }}
          path: model-eval-results
          if-no-files-found: error
          retention-days: 30
