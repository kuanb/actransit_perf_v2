<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An independent AC Transit real-time map and service performance report card.">
  <title>AC Transit Live Map &amp; Performance</title>
  <link rel="canonical" href="https://ac-transit.com/">
  <style>
    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100dvh;
      margin: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #fff;
      background: #0d2236;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .site-banner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 18px 24px;
      background: #173a59;
      border-bottom: 4px solid #f1c84b;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .banner-copy {
      min-width: 0;
    }

    .eyebrow {
      display: block;
      margin-bottom: 3px;
      color: #f1c84b;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.2vw, 30px);
      line-height: 1.2;
    }

    .attribution {
      margin: 5px 0 0;
      color: #d9e5ef;
      font-size: 14px;
    }

    .attribution a {
      color: inherit;
    }

    .report-card-button {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 13px 22px;
      border-radius: 7px;
      color: #172a3a;
      background: #f1c84b;
      font-size: 16px;
      font-weight: 750;
      text-decoration: none;
      box-shadow: 0 2px 0 #b28e22;
    }

    .report-card-button:hover,
    .report-card-button:focus-visible {
      background: #ffdc6b;
    }

    .map-frame {
      flex: 1;
      min-height: 0;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #eef2f5;
    }

    @media (max-width: 680px) {
      .site-banner {
        align-items: stretch;
        flex-direction: column;
        gap: 12px;
        padding: 15px 16px;
      }

      .attribution {
        font-size: 13px;
      }

      .report-card-button {
        width: 100%;
        min-height: 46px;
        padding: 10px 16px;
      }
    }
  </style>
</head>
<body>
  <header class="site-banner">
    <div class="banner-copy">
      <span class="eyebrow">Independent project</span>
      <h1>This is not an official AC Transit website.</h1>
      <p class="attribution">Built and maintained by <a href="https://kuanbutts.com/">Kuan Butts</a>.</p>
    </div>
    <a class="report-card-button" href="report-card/">View the real-time report card →</a>
  </header>

  <main class="map-frame">
    <iframe
      src="https://kuanbutts.com/actransit/"
      title="AC Transit real-time map"
      loading="eager"
    ></iframe>
  </main>

  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "0e36b12e46b04a69b5e9ff6883f6d23d"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
